<!-- vault/templates/vault/add_password.html -->
{% extends "vault/base.html" %}

{% block content %}
<h1 style="text-align: center;">STORE_NEW_CREDENTIAL</h1>

<form method="POST">
    {% csrf_token %}

    <div class="form-group">
        <label class="form-label" for="id_website_name">Target / System Name:</label>
        <input type="text" name="website_name" id="id_website_name" required placeholder="e.g. AWS_CONSOLE" autocomplete="off">
    </div>

    <div class="form-group">
        <label class="form-label" for="id_website_url">System URL / Node IP:</label>
        <input type="url" name="website_url" id="id_website_url" placeholder="https://">
    </div>

    <div class="form-group">
        <label class="form-label" for="id_username_or_email">Operator / Identity:</label>
        <input type="text" name="username_or_email" id="id_username_or_email" required placeholder="OPERATOR_NAME" autocomplete="off">
    </div>

    <div class="form-group">
        <label class="form-label" for="id_password">Plaintext Secret:</label>
        <input type="password" name="password" id="id_password" required placeholder="••••••••">
    </div>

    <div class="btn-container">
        <button type="submit" class="cyber-btn">
            <span>Encrypt &amp; Commit</span>
            <span class="btn-arrow">&gt;&gt;</span>
        </button>
    </div>
</form>

<div style="text-align: center; margin-top: 20px;">
    <a href="{% url 'dashboard' %}" style="color: var(--text-muted); font-size: 0.75rem; text-decoration: none;">&lt;&lt; CANCEL_OPERATION</a>
</div>
{% endblock %}
