<!-- vault/templates/vault/base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pass_script</title>
    <style>
        :root {
            --neon-green: #00ff66;
            --neon-green-dim: rgba(0, 255, 102, 0.12);
            --neon-green-glow: rgba(0, 255, 102, 0.35);
            --dark-bg: #0b0f12;
            --terminal-gray: #12181d;
            --border-gray: #243038;
            --text-muted: #94a3b8;
            --cyber-red: #ff3366;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--dark-bg);
            color: #ffffff;
            font-family: 'Fira Code', 'Courier New', Courier, monospace;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 850px;
            margin: auto;
            border: 1px solid var(--border-gray);
            border-top: 3px solid var(--neon-green);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 0 15px var(--neon-green-dim);
            padding: 30px;
            background-color: var(--terminal-gray);
            border-radius: 4px;
        }

        h1, h2 {
            color: var(--neon-green);
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 1px dashed var(--border-gray);
            padding-bottom: 10px;
            margin-top: 0;
        }

        /* Form Labels & Controls */
        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            color: var(--text-muted);
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        input {
            background: #070a0c;
            border: 1px solid var(--border-gray);
            color: #fff;
            padding: 12px;
            font-family: inherit;
            font-size: 0.9rem;
            width: 100%;
            border-radius: 3px;
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--neon-green);
            box-shadow: 0 0 8px var(--neon-green-dim);
        }

        /* Alert Box */
        .alert-box {
            background: rgba(255, 51, 102, 0.1);
            border: 1px solid var(--cyber-red);
            color: var(--cyber-red);
            padding: 10px;
            font-size: 0.8rem;
            margin-bottom: 20px;
            border-radius: 3px;
            text-align: center;
        }

        /* Centered Grey & Green Square Cyber Button */
        .btn-container {
            display: flex;
            justify-content: center;
            width: 100%;
            margin-top: 25px;
        }

        .cyber-btn {
            position: relative;
            min-width: 220px;
            padding: 12px 24px;
            background: var(--neon-green-dim);
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            border-radius: 0;
            text-decoration: none;
            transition: all 0.25s ease;
        }

        .cyber-btn .btn-arrow {
            color: var(--neon-green);
            transition: transform 0.2s ease;
        }

        .cyber-btn:hover {
            background: var(--neon-green);
            color: #05080a;
            box-shadow: 0 0 20px var(--neon-green-glow);
            transform: translateY(-2px);
        }

        .cyber-btn:hover .btn-arrow {
            color: #05080a;
            transform: translateX(4px);
        }

        .cyber-btn:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
